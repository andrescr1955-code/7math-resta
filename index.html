<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restas Mágicas - MM7apps</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #1f6fe5; 
            --accent: #3498db;
            --danger: #e74c3c;
            --success: #27ae60;
            --bg: #dfe4ea;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; user-select: none; }
        .box { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); width: 100%; max-width: 500px; text-align: center; position: relative; }
        
        h2 { color: var(--primary); margin-bottom: 5px; padding-bottom: 0; }
        .instruccion { color: #666; font-style: italic; font-size: 16px; margin-bottom: 15px; height: 20px; }

        .btn-nivel { 
            padding: 12px; background: var(--accent); color: white; border: none; 
            width: 100%; border-radius: 12px; font-size: 16px; font-weight: bold; 
            cursor: pointer; margin-top: 8px;
        }

        .input-manual {
            font-size: 24px; width: 100px; padding: 10px; text-align: center;
            border: 3px solid #ddd; border-radius: 12px; margin: 5px; background: #fff; cursor: pointer;
        }
        .input-manual.activo {
            border-color: var(--primary); background: #eef6ff; box-shadow: 0 0 10px rgba(31, 111, 229, 0.3);
        }

        .operacion-grid {
            display: grid; 
            grid-template-columns: 70px repeat(4, 1fr);
            gap: 5px; align-items: center; margin: 20px 0;
        }

        .celda { height: 50px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; }
        .label { font-size: 9px; color: #7f8c8d; text-transform: uppercase; font-weight: bold; }
        
        .p-box-double { display: flex; flex-direction: column; gap: 2px; height: 50px; justify-content: center; }
        .casilla-ajuste { 
            font-size: 13px; border: 2px solid #ccc; border-radius: 4px; 
            height: 20px; width: 40px; margin: 0 auto; visibility: hidden; 
            display: flex; align-items: center; justify-content: center; font-weight: bold;
        }
        .ajuste-visible { visibility: visible !important; background: #fff9c4; border-color: orange; cursor: pointer; }
        .ajuste-activo { border-color: var(--accent); background: #eef6ff; box-shadow: 0 0 5px var(--accent); }
        .ajuste-ok { background: var(--success) !important; color: white !important; border-color: var(--success) !important; visibility: visible !important; }

        .linea { grid-column: 1 / 6; height: 4px; background: #333; border-radius: 2px; }

        .input-res {
            width: 100%; height: 55px; text-align: center; font-size: 26px;
            border: 2px solid #bdc3c7; border-radius: 10px; outline: none; background: white;
        }
        .input-hidden { visibility: hidden; pointer-events: none; }
        
        .input-res.active { border-color: var(--accent); background: #f0faff; }
        .input-res.correct { background: var(--success); color: white; border-color: #1e8449; }
        .input-res.error { background: var(--danger); color: white; border-color: #c0392b; }

        .controles-flujo { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .btn-verde { background: var(--success); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; font-size: 14px; }

        .teclado { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .btn-tecla { padding: 15px 5px; font-size: 22px; cursor: pointer; border: 1px solid #ddd; border-radius: 8px; background: white; font-weight: bold; }
        
        .btn-especial { background: var(--accent); color: white; grid-column: span 2; font-size: 14px; padding: 15px 2px; }
        .btn-especial.disabled { background: #bdc3c7; cursor: not-allowed; }
        .btn-home { background: #7f8c8d; color: white; font-size: 14px; padding: 15px 2px; }

        .consola { margin-bottom: 10px; padding: 10px; background: #2f3640; color: #f5f6fa; border-radius: 8px; font-size: 14px; border-left: 5px solid var(--accent); min-height: 20px;}
        
        /* Cortina de bloqueo de seguridad */
        #lock-screen { position: absolute; top:0; left:0; width:100%; height:100%; background:white; border-radius:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; box-sizing:border-box; z-index:9999; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="box">
    <!-- Cortina de Seguridad Anti-Piratería -->
    <div id="lock-screen" style="display:none;">
        <span style="font-size:50px;">⏳</span>
        <h3 style="color:var(--danger); margin-top:15px;">Periodo de Evaluación Terminado</h3>
        <p style="color:#666; font-size:14px;">Esta versión demo caducó el 31 de Julio de 2026.</p>
        <p style="color:#666; font-size:14px; font-weight:bold;">Para adquirir la licencia completa, contacte al desarrollador.</p>
    </div>

    <h2 id="titulo">7Math</h2>
    <p style="color: #27ae60; font-weight: bold; margin-bottom: 15px;">
        Restas Mágicas 🌟
    </p>
    <div id="instruccion" class="instruccion"></div>
    
    <div id="pantalla-inicio">
        <button class="btn-nivel" onclick="iniciarNivel(1)">2 dígitos (Nivel 1)</button>
        <button class="btn-nivel" onclick="iniciarNivel(2)">3 dígitos (Nivel 2)</button>
        <button class="btn-nivel" onclick="iniciarNivel(3)">4 dígitos (Nivel 3)</button>
        <button class="btn-nivel" onclick="iniciarNivel(4)">4 dígitos (Nivel 4)</button>
        <button class="btn-nivel" onclick="iniciarNivel(5)" style="background: #c0392b;">4 dígitos (Nivel 5)</button>
        <button class="btn-nivel" onclick="mostrarModoManual()" style="background: #8e44ad;">Yo escribo los números (Nivel 6)</button>
    </div>

    <div id="pantalla-manual" style="display:none;">
        <p>Escribe los números de tu tarea:</p>
        <input type="text" id="manual-m" class="input-manual" readonly placeholder="?" onclick="setFocus('manual-m')">
        <span style="font-size: 30px; font-weight: bold; color: var(--danger)">−</span>
        <input type="text" id="manual-s" class="input-manual" readonly placeholder="?" onclick="setFocus('manual-s')">
        <button class="btn-nivel" style="background:var(--success); margin-bottom: 15px;" onclick="validarManual()">¡Empezar!</button>
        <button class="btn-nivel" style="background:#7f8c8d; color:white; margin-bottom: 15px;" onclick="irAlMenu()">Regresar</button>
    </div>

    <div id="pantalla-juego" style="display:none;">
        <div class="operacion-grid">
            <div class="celda label">Ajuste</div>
            <div class="p-box-double"><div id="in-3" class="casilla-ajuste" onclick="seleccionarAjuste('in-3')"></div><div id="out-3" class="casilla-ajuste" onclick="seleccionarAjuste('out-3')"></div></div>
            <div class="p-box-double"><div id="in-2" class="casilla-ajuste" onclick="seleccionarAjuste('in-2')"></div><div id="out-2" class="casilla-ajuste" onclick="seleccionarAjuste('out-2')"></div></div>
            <div class="p-box-double"><div id="in-1" class="casilla-ajuste" onclick="seleccionarAjuste('in-1')"></div><div id="out-1" class="casilla-ajuste" onclick="seleccionarAjuste('out-1')"></div></div>
            <div class="p-box-double"><div id="in-0" class="casilla-ajuste" onclick="seleccionarAjuste('in-0')"></div><div id="out-0" class="casilla-ajuste" onclick="seleccionarAjuste('out-0')"></div></div>

            <div class="celda label">Arriba</div>
            <div id="m-3" class="celda"></div><div id="m-2" class="celda"></div><div id="m-1" class="celda"></div><div id="m-0" class="celda"></div>

            <div class="celda" style="font-size:35px; color: var(--danger)">−</div>
            <div id="s-3" class="celda"></div><div id="s-2" class="celda"></div><div id="s-1" class="celda"></div><div id="s-0" class="celda"></div>

            <div class="linea"></div>
            <div class="celda label">Total</div>
            <input type="text" id="r-3" class="input-res" readonly>
            <input type="text" id="r-2" class="input-res" readonly>
            <input type="text" id="r-1" class="input-res" readonly>
            <input type="text" id="r-0" class="input-res" readonly>
        </div>

        <div class="consola" id="consola">Iniciando...</div>

        <div class="controles-flujo">
            <button class="btn-verde" id="btn-nueva-op" onclick="reiniciarMismaCifra()">Nueva Operación</button>
            <button class="btn-verde" id="btn-pp-amigo">PP tu amigo</button>
        </div>
    </div>

    <div id="seccion-teclado" style="display:none; margin-top: 15px;">
        <div class="teclado">
            <script>for(let i=1; i<=9; i++) document.write(`<button class="btn-tecla" onclick="tecleo(${i})">${i}</button>`);</script>
            <button class="btn-tecla" onclick="tecleo(0)">0</button>
            <button id="btn-borrar" class="btn-tecla" style="background:#ffcccc;" onclick="borrarDato()">←</button>
            <button id="btn-prestamo" class="btn-tecla btn-especial" onclick="gestionarPrestamo()">PEDIR PRESTADO</button>
            <button class="btn-tecla btn-home" onclick="irAlMenu()">INICIO</button>
        </div>
    </div>
</div>

<script>
    // SISTEMA ANTI-PIRATERÍA (CANDADO DE FECHA Y AJUSTE DE CONTEXTO OFUSCADO)
    (function(){
        const _0x3b1d = new Date(2026, 6, 31); // 31 de Julio de 2026
        const _0x5c2a = new Date();
        if(_0x5c2a > _0x3b1d){
            window.addEventListener("load", function(){
                document.getElementById('lock-screen').style.display = 'flex';
            });
        }
    })();

    // Bloqueo de Teclado de desarrollo F12, Ctrl+Shift+I, U
    window.addEventListener('keydown', function(_0x1b2e) {
        if (_0x1b2e.keyCode == 123 || (_0x1b2e.ctrlKey && _0x1b2e.shiftKey && (_0x1b2e.keyCode == 73 || _0x1b2e.keyCode == 74)) || (_0x1b2e.ctrlKey && _0x1b2e.keyCode == 85)) {
            _0x1b2e.preventDefault();
            return false;
        }
    });

    let m_orig = [0,0,0,0], s_orig = [0,0,0,0];
    let presto_derecha = [false, false, false, false], recibio_izquierda = [false, false, false, false];
    let cursor = 0, nivelActual = 0, digitosActuales = 0, ajusteEnFoco = null;
    let modoActual = "inicio", inputActivoManual = "manual-m";

    function irAlMenu() { location.reload(); }

    function mostrarModoManual() {
        modoActual = "config";
        nivelActual = 6;
        document.getElementById('manual-m').value = "";
        document.getElementById('manual-s').value = "";
        document.getElementById('instruccion').innerText = "NIVEL 6: ESCRIBE TU TAREA";
        document.getElementById('pantalla-inicio').style.display = 'none';
        document.getElementById('pantalla-manual').style.display = 'block';
        document.getElementById('seccion-teclado').style.display = 'block'; 
        document.getElementById('btn-prestamo').classList.add('disabled'); 
        setFocus('manual-m');
    }

    function setFocus(id) {
        inputActivoManual = id;
        actualizarFocoVisual();
    }

    function actualizarFocoVisual() {
        document.querySelectorAll('.input-manual').forEach(el => el.classList.remove('activo'));
        document.getElementById(inputActivoManual).classList.add('activo');
    }

    function borrarDato() {
        if (modoActual === "config") {
            const input = document.getElementById(inputActivoManual);
            input.value = input.value.slice(0, -1);
        }
    }

    function validarManual() {
        const v1 = document.getElementById('manual-m').value;
        const v2 = document.getElementById('manual-s').value;

        if (!v1 || !v2) {
            return alert("Escribe ambos números para la resta");
        }

        let valM = parseInt(v1);
        let valS = parseInt(v2);

        if (valS > valM) {
            return alert("El número de arriba debe ser mayor o igual al de abajo");
        }

        if (v1.length > 4 || v2.length > 4) {
            return alert("El número máximo permitido es de 4 dígitos");
        }

        digitosActuales = Math.max(v1.length, v2.length);
        
        document.getElementById('pantalla-manual').style.display = 'none';
        document.getElementById('pantalla-juego').style.display = 'block';
        
        const btnP = document.getElementById('btn-prestamo');
        btnP.classList.remove('disabled');
        btnP.innerText = "PEDIR PRESTADO";
        document.getElementById('instruccion').innerText = "NIVEL 6: FORMATO CON PRÉSTAMOS";

        modoActual = "juego";
        prepararResta(valM, valS);
    }

    function iniciarNivel(n) {
        nivelActual = n;
        modoActual = "juego";
        document.getElementById('pantalla-inicio').style.display = 'none';
        document.getElementById('pantalla-juego').style.display = 'block';
        document.getElementById('seccion-teclado').style.display = 'block'; 
        
        const btnP = document.getElementById('btn-prestamo');
        if (n === 5) {
            btnP.classList.add('disabled');
            btnP.innerText = "SÓLO MENTAL";
            document.getElementById('instruccion').innerText = "NIVEL 5: RESTAS MENTALES";
        } else {
            btnP.classList.remove('disabled');
            btnP.innerText = "PEDIR PRESTADO";
            document.getElementById('instruccion').innerText = (n === 4) ? "NIVEL 4: COLOCA AJUSTES MANUALES" : "NIVEL " + n;
        }

        if (n === 1) digitosActuales = 2;
        else if (n === 2) digitosActuales = 3;
        else digitosActuales = 4;

        let max = Math.pow(10, digitosActuales) - 1;
        let min = Math.pow(10, digitosActuales - 1);
        let valM = Math.floor(Math.random() * (max - min + 1)) + min;
        let valS = Math.floor(Math.random() * (valM - 1)) + 1;
        
        prepararResta(valM, valS);
    }

    function reiniciarMismaCifra() { 
        if (nivelActual === 6) {
            document.getElementById('pantalla-juego').style.display = 'none';
            mostrarModoManual();
        } else {
            iniciarNivel(nivelActual); 
        }
    }

    function seleccionarAjuste(id) {
        if (nivelActual !== 4) return;
        const el = document.getElementById(id);
        if (!el.classList.contains('ajuste-visible') || el.classList.contains('ajuste-ok')) return;
        if (ajusteEnFoco) document.getElementById(ajusteEnFoco).classList.remove('ajuste-activo');
        ajusteEnFoco = id;
        el.classList.add('ajuste-activo');
    }

    function prepararResta(valM, valS) {
        const strM = valM.toString().padStart(4, '0');
        const strS = valS.toString().padStart(4, '0');
        
        let m_temp = strM.split('').map(Number).reverse();
        let s_temp = strS.split('').map(Number).reverse();
        let p_derecha = [false, false, false, false], r_izquierda = [false, false, false, false];

        for(let i=0; i<4; i++) {
            let actualM = m_temp[i];
            if(r_izquierda[i]) actualM += 10;
            if(p_derecha[i]) actualM -= 1;

            if(actualM < s_temp[i] && i < 3) {
                p_derecha[i+1] = true;
                r_izquierda[i] = true;
            }
        }

        for(let i=0; i<4; i++) {
            m_orig[i] = m_temp[i]; s_orig[i] = s_temp[i];
            presto_derecha[i] = p_derecha[i];
            recibio_izquierda[i] = r_izquierda[i];
            
            const input = document.getElementById(`r-${i}`);
            input.value = '';
            input.className = 'input-res';
            
            if (i >= digitosActuales) {
                input.classList.add('input-hidden');
            } else {
                input.classList.remove('input-hidden');
            }
            
            ['in-', 'out-'].forEach(p => { 
                let el = document.getElementById(p+i);
                el.innerText = ''; el.className = 'casilla-ajuste'; el.style.visibility = "hidden";
            });
        }
        cursor = 0; ajusteEnFoco = null;
        refrescarUI();
    }

    function refrescarUI() {
        for(let i=0; i<4; i++) {
            const mCelda = document.getElementById(`m-${i}`);
            const sCelda = document.getElementById(`s-${i}`);
            
            if (i >= digitosActuales) {
                mCelda.innerText = ""; 
                sCelda.innerText = "";
            } else {
                mCelda.innerText = m_orig[i];
                sCelda.innerText = s_orig[i];
            }
            document.getElementById(`r-${i}`).classList.remove('active');
        }
        document.getElementById(`r-${cursor}`).classList.add('active');
    }

    function gestionarPrestamo() {
        if (nivelActual === 5 || cursor >= (digitosActuales - 1)) return;
        
        if (nivelActual === 4) {
            let elIn = document.getElementById(`in-${cursor}`);
            let elOut = document.getElementById(`out-${cursor+1}`);
            if(!elIn.classList.contains('ajuste-ok')) { elIn.innerText = "+"; elIn.classList.add('ajuste-visible'); }
            if(!elOut.classList.contains('ajuste-ok')) { elOut.innerText = "-"; elOut.classList.add('ajuste-visible'); }
            msg("Completa los ajustes.");
        } 
        else {
            if (recibio_izquierda[cursor]) {
                document.getElementById(`in-${cursor}`).innerText = "+10";
                document.getElementById(`in-${cursor}`).classList.add('ajuste-visible', 'ajuste-ok');
                document.getElementById(`out-${cursor+1}`).innerText = "-1";
                document.getElementById(`out-${cursor+1}`).classList.add('ajuste-visible', 'ajuste-ok');
                msg("¡Ajuste visual listo!");
            } else {
                msg("No es necesario prestar.");
            }
        }
    }

    function tecleo(num) {
        if (modoActual === "config") {
            const input = document.getElementById(inputActivoManual);
            if (input.value.length < 4) {
                input.value += num;
            }
            return;
        }

        if (nivelActual === 4 && ajusteEnFoco) {
            let el = document.getElementById(ajusteEnFoco);
            if (ajusteEnFoco.startsWith('in-')) { 
                if (el.innerText === "+" && num === 1) el.innerText = "+1";
                else if (el.innerText === "+1" && num === 0) { 
                    el.innerText = "+10"; el.classList.add('ajuste-ok'); el.classList.remove('ajuste-activo');
                    ajusteEnFoco = null;
                }
            } else { 
                if (num === 1) { 
                    el.innerText = "-1"; el.classList.add('ajuste-ok'); el.classList.remove('ajuste-activo');
                    ajusteEnFoco = null;
                }
            }
            return;
        }

        if (nivelActual === 4) {
            let elIn = document.getElementById(`in-${cursor}`);
            if (elIn.classList.contains('ajuste-visible') && !elIn.classList.contains('ajuste-ok')) {
                return msg("Falta el ajuste de arriba.");
            }
        }

        let m_real = m_orig[cursor];
        if (recibio_izquierda[cursor]) m_real += 10;
        if (presto_derecha[cursor]) m_real -= 1;

        let res_correcto = m_real - s_orig[cursor];
        let input = document.getElementById(`r-${cursor}`);

        if (num === res_correcto) {
            input.value = num; input.className = "input-res correct";
            if (cursor < (digitosActuales - 1)) { cursor++; refrescarUI(); msg("¡Muy bien!"); }
            else { msg("¡RESTA TERMINADA!"); confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } }); }
        } else {
            input.value = num; input.className = "input-res error";
            msg("Error.");
            setTimeout(() => { input.value = ""; input.className = "input-res active"; }, 600);
        }
    }

    function msg(t) { document.getElementById('consola').innerText = t; }
</script>
</body>
</html>
